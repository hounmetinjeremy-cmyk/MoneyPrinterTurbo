name: Build Clip Library

# Daily, offline job: downloads a rotating slice of control/subjects.txt's
# stock footage, keeps only "pure movement" segments (no visible face, real
# motion — see app/services/clip_library.py), and stores them in Supabase
# (Storage for the files, mpt.movement_clips for the metadata + text
# embedding). Deliberately separate from daily-short.yml: this builds up a
# reusable library over time rather than fetching fresh footage per run, and
# is not on the critical path of any single day's video.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily — offset from daily-short.yml's 08:00
  workflow_dispatch:
    inputs:
      subjects_per_run:
        description: "Override: subjects to index this run (blank = daily default)"
        required: false
        default: ""
      search_terms_per_subject:
        description: "Override: search terms per subject (blank = daily default)"
        required: false
        default: ""
      videos_per_search_term:
        description: "Override: videos downloaded per search term (blank = daily default)"
        required: false
        default: ""

concurrency:
  group: build-clip-library
  cancel-in-progress: false

jobs:
  build-library:
    runs-on: ubuntu-latest
    # The scheduled daily run stays small (a few minutes); a manually
    # triggered scale test with the overrides above can run far longer —
    # this ceiling exists to get a real timing measurement instead of an
    # arbitrary cutoff, not because the daily run needs this much room.
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --python 3.11

      - name: Configure config.toml from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: uv run --no-sync python scripts/configure_ci.py

      - name: Build today's clip library slice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIP_LIBRARY_SUBJECTS_PER_RUN: ${{ github.event.inputs.subjects_per_run }}
          CLIP_LIBRARY_SEARCH_TERMS_PER_SUBJECT: ${{ github.event.inputs.search_terms_per_subject }}
          CLIP_LIBRARY_VIDEOS_PER_SEARCH_TERM: ${{ github.event.inputs.videos_per_search_term }}
        run: uv run --no-sync python scripts/build_clip_library.py
